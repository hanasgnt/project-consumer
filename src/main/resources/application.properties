# Application
spring.application.name=project-consumer
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/bootcamp
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=transaction-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Kafka JSON
spring.kafka.consumer.properties.spring.json.trusted.packages=com.bootcamp.project_consumer.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.bootcamp.project_consumer.dto.TransactionEvent

# Logging
logging.pattern.console=%d{HH:mm:ss} [%thread{id}] [%-5p]%c{0}- %msg
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

logging.file.name=log/application.log

# Log Level
logging.level.root=INFO
logging.level.com.bootcamp=DEBUG

# Rolling File
logging.logback.rollingpolicy.max-file-size=1MB
logging.logback.rollingpolicy.file-name-pattern=log/application-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-history=5

